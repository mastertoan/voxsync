[project]
name = "voxsync-server"
version = "0.1.0"
description = "Local VieNeu-TTS dubbing server for the VoxSync Chrome extension (127.0.0.1 only)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "vieneu==3.8.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "soundfile>=0.12",
    "numpy",
    "sherpa-onnx>=1.12",
]

[project.scripts]
voxsync-server = "voxsync_server.main:run"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
